name: API Deploy

# Tech Spec §7 — release-folder + atomic symlink switch to the Google Cloud
# VM (ADR-0001), only for apps/api changes landing on main. Requires these
# repo secrets, set up once per Tech Spec §12 step 8 (see infra/README.md for
# the one-time server-side setup deploy-release.sh expects: a bare mirror
# clone at $DEPLOY_ROOT/repo.git and $DEPLOY_ROOT/shared/apps-api.env):
#   GCP_SSH_HOST, GCP_SSH_USER, GCP_SSH_KEY, GCP_DEPLOY_ROOT
on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "infra/**"
      - ".github/workflows/api-deploy.yml"

concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy release to Google Cloud VM
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_ROOT: ${{ secrets.GCP_DEPLOY_ROOT }}
          GIT_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.GCP_SSH_HOST }}
          username: ${{ secrets.GCP_SSH_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: DEPLOY_ROOT,GIT_SHA
          # deploy-release.sh isn't scp'd in — it's read straight out of the
          # bare mirror at the ref being deployed, so an update to the script
          # itself takes effect on the very next deploy, not the one after.
          script: |
            set -euo pipefail
            git --git-dir="$DEPLOY_ROOT/repo.git" fetch --quiet origin "$GIT_SHA"
            git --git-dir="$DEPLOY_ROOT/repo.git" show "$GIT_SHA:infra/scripts/deploy-release.sh" \
              | bash -s -- "$DEPLOY_ROOT" "$GIT_SHA"

      - name: Verify health endpoint after deploy
        run: |
          for i in $(seq 1 10); do
            if curl -sf "https://api.tokospace.com/health" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Health check failed after deploy."
          exit 1
