name: tokospace

# PRODUCTION/base topology (ADR-0001 target) for apps/api (Tech Spec §4, §5).
# PostgreSQL is Google Cloud SQL, reached through `cloud-sql-proxy` below —
# it is NOT a Docker service here. apps/web is not run here either — it's a
# separate Vercel deployment (Tech Spec §2.3); for local frontend dev, run
# `pnpm dev` inside apps/web pointed at this API via NEXT_PUBLIC_API_URL.
#
# For local development, layer docker-compose.local.yml on top of this file
# (see infra/README.md) — it is the only file that adds a self-hosted
# `postgres` service back. Never add `postgres` here.
#
# Resource settings below are read from .env, generated by
# infra/scripts/tune.sh — never hardcode them here (Tech Spec §4.1).

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8000:80"
    volumes:
      - ./apps/api:/var/www/html:delegated
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-4}
    volumes:
      - ./apps/api:/var/www/html:delegated

  horizon:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "horizon"]
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      HORIZON_MAX_PROCESSES: ${HORIZON_MAX_PROCESSES:-2}
    volumes:
      - ./apps/api:/var/www/html:delegated

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      cloud-sql-proxy:
        condition: service_started
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/var/www/html:delegated

  # Google Cloud SQL Auth Proxy — TCP tunnel from the internal Compose
  # network to Cloud SQL PostgreSQL (ADR-0001 §3). No credentials are
  # configured here: on the production GCE VM, the proxy authenticates via
  # the attached service account's Application Default Credentials, not a
  # committed key file. CLOUD_SQL_CONNECTION_NAME (format
  # PROJECT:REGION:INSTANCE) is a Phase 2 infrastructure value supplied at
  # runtime via .env — it does not exist yet, so it is not hardcoded here.
  #
  # No Docker healthcheck is defined: the published image
  # (gcr.io/cloud-sql-connectors/cloud-sql-proxy) is distroless and has no
  # shell or CLI tooling to run a CMD-based probe against, only the
  # `/cloud-sql-proxy` entrypoint itself (verified by inspecting the image —
  # `sh`/`nc`/`wget` are all absent). `condition: service_started` is used
  # for dependents instead, and infra/scripts/deploy-release.sh retries the
  # first migration attempt to absorb the startup race this leaves open —
  # see the comment there. Revisiting this with the proxy's built-in
  # --health-check HTTP endpoint (checked from another container, since this
  # one can't check itself) is a reasonable Phase 2 improvement.
  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.2
    profiles: ["production"]
    command:
      - "--structured-logs"
      - "--address=0.0.0.0"
      - "--port=5432"
      - "${CLOUD_SQL_CONNECTION_NAME}"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
