name: tokospace

# Local/target-environment stack for apps/api (Tech Spec §4, §5). apps/web is
# not run here — it's a separate Vercel deployment (Tech Spec §2.3); for local
# frontend dev, run `pnpm dev` inside apps/web pointed at this API via
# NEXT_PUBLIC_API_URL. Resource settings below are read from .env, generated
# by `infra/scripts/tune.sh` — never hardcode them here (Tech Spec §4.1).

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - php
    ports:
      - "8000:80"
    volumes:
      - ./apps/api:/var/www/html:delegated
      - ./infra/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  php:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-4}
    volumes:
      - ./apps/api:/var/www/html:delegated

  horizon:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "horizon"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    environment:
      HORIZON_MAX_PROCESSES: ${HORIZON_MAX_PROCESSES:-2}
    volumes:
      - ./apps/api:/var/www/html:delegated

  scheduler:
    build:
      context: .
      dockerfile: infra/docker/php/Dockerfile
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./apps/api/.env
    volumes:
      - ./apps/api:/var/www/html:delegated

  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tokospace}
      POSTGRES_USER: ${POSTGRES_USER:-tokospace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tokospace}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tokospace}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
