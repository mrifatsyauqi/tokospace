server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    index index.php;

    client_max_body_size 20m;

    # Docker's embedded DNS (127.0.0.11) at a short TTL, with fastcgi_pass
    # pointed at a variable rather than the bare hostname — otherwise nginx
    # resolves "php" once at config load and keeps that IP until nginx
    # itself restarts, so a `docker compose up -d --force-recreate php`
    # deploy (new container, new IP) leaves nginx serving 502s until someone
    # notices and restarts it too. Verified this exact failure mode locally
    # during Stage 0 (see PR discussion) before adding this.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
